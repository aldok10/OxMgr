[package]
name = "oxmgr-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "OxMgr daemon: HTTP/SSE surface, IPC socket protocol, config loader"

[dependencies]
oxmgr-core = { workspace = true }
oxmgr-store = { workspace = true }
oxmgr-metrics = { workspace = true }
oxmgr-analytics = { workspace = true }
oxmgr-manager = { workspace = true }

anyhow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
dirs = { workspace = true }
flate2 = { workspace = true }
futures-util = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process", "user"] }

[dev-dependencies]
serial_test = { version = "3.5" }
tower = { version = "0.5", features = ["util"] }
futures = { version = "0.3", default-features = false, features = ["executor"] }

[lints]
workspace = true
